# Codemagic: iOS をクラウド Mac でビルドし App Store Connect へ提出
#
# Developer Portal 連携（UI）が FORBIDDEN でも動くよう、API Key は環境変数で渡す。
#
# === Codemagic アプリ設定でやること（初回のみ）===
#
# 1. Application → Environment variables → グループ appstore_credentials を作成
#
# 2. 環境変数グループ appstore_credentials に Secret を 1 つだけ追加:
#    APP_STORE_CONNECT_PRIVATE_KEY = AuthKey_ATBD5UGJTG.p8 の全文
#    （./scripts/prepare_codemagic_env.sh で codemagic-env-paste.txt を生成）
#    Secure として保存。YAML 側で \\n / 引用符 / base64 を正規化してから publish する。
#
# 3. Team settings → Code signing identities（Developer Portal 連携なしで可）
#    - Upload: Apple Distribution 証明書 (.p12)
#      手元: codemagic-signing/joyphysics-distribution.p12
#      パスワード: codemagic-signing/.p12_password（git 除外）
#    - Upload: com.joyphysics の App Store プロビジョニング (.mobileprovision)
#      手元: codemagic-signing/com.joyphysics.appstore.mobileprovision
#
# 4. ワークフロー ios-app-store-release を実行
#
# 参考: https://docs.codemagic.io/yaml-publishing/app-store-connect/

workflows:
  ios-app-store-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        APP_STORE_CONNECT_KEY_IDENTIFIER: ATBD5UGJTG
        APP_STORE_CONNECT_ISSUER_ID: c64fb6be-f1d2-4e04-80b5-2841def3da52
        # App Store: 実験で学ぶ高校物理 ー joy-physics (bundle com.joyphysics)
        APP_STORE_APPLE_ID: "6748957698"
        RELEASE_NOTES_JA: |
          ・波動実験（閉管水位・駆動弦）と波面ビューを追加
          ・熱力学のPV図をリットル・ヘクトパスカル表示に改善
          ・実験・理論一覧の見た目を調整
          ・その他の不具合修正と改善
        RELEASE_NOTES_EN: |
          - Added closed-pipe water level and driven-string wave experiments
          - Improved PV diagram units (L / hPa)
          - UI polish for experiment and theory lists
          - Bug fixes and improvements
      xcode: latest
      flutter: stable
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.joyphysics
    scripts:
      - name: Flutter pub get
        script: |
          set -e
          flutter pub get
      - name: CocoaPods (ios)
        script: |
          set -e
          cd ios && pod install && cd ..
      - name: Flutter build IPA
        script: |
          set -euo pipefail
          chmod +x scripts/resolve_ios_release_version.sh
          eval "$(./scripts/resolve_ios_release_version.sh)"
          echo "Building $VERSION_NAME ($VERSION_CODE) [pubspec_build=$PUBSPEC_CODE asc=$LATEST_ASC]"

          flutter build ios --release --config-only \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

          # config-only 後に Xcode 側バージョンを明示同期（古い Info.plist 対策）
          (
            cd ios
            agvtool new-marketing-version "$VERSION_NAME"
            agvtool new-version -all "$VERSION_CODE"
          )

          xcode-project use-profiles

          if [ ! -f /Users/builder/export_options.plist ]; then
            echo "ERROR: /Users/builder/export_options.plist が生成されていません"
            exit 1
          fi

          echo "=== version check ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/Runner/Info.plist || true

          echo "=== com.joyphysics 用プロファイル ==="
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            if security cms -D -i "$f" 2>/dev/null | grep -q '7K99YVR868.com.joyphysics'; then
              echo "--- $f ---"
              security cms -D -i "$f" | grep -E '<key>Name</key>|<key>UUID</key>' || true
            fi
          done
          echo "=== export_options.plist ==="
          cat /Users/builder/export_options.plist

          flutter build ipa --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Publish to App Store Connect
        script: |
          set -euo pipefail

          KEY_FILE=/tmp/AuthKey.p8
          IPA_PATH=$(ls -1 build/ios/ipa/*.ipa | head -1)
          if [ -z "${IPA_PATH:-}" ] || [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA not found under build/ios/ipa/"
            exit 1
          fi

          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "ERROR: APP_STORE_CONNECT_PRIVATE_KEY is missing."
            echo "Set the full PEM (BEGIN/END PRIVATE KEY) as a Secure variable in group appstore_credentials."
            exit 1
          fi

          # Normalize env value: strip wrapping quotes, turn literal \n into newlines,
          # or base64-decode when the value is not already PEM text.
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          raw = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY", "")
          if not raw or not raw.strip():
              print("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty after read.", file=sys.stderr)
              sys.exit(1)

          text = raw.strip()
          if (text.startswith('"') and text.endswith('"')) or (text.startswith("'") and text.endswith("'")):
              text = text[1:-1].strip()

          # Prefer expanding literal \\n before base64 guess (common Codemagic paste form).
          if "\\n" in text and "-----BEGIN" in text:
              text = text.replace("\\n", "\n").replace("\\r", "\r")

          def looks_like_pem(s: str) -> bool:
              return "-----BEGIN" in s and "PRIVATE KEY-----" in s

          if not looks_like_pem(text):
              compact = re.sub(r"\s+", "", text)
              decoded = None
              for candidate in (compact, text):
                  try:
                      decoded = base64.b64decode(candidate, validate=False).decode("utf-8")
                      if looks_like_pem(decoded):
                          text = decoded.strip()
                          break
                  except Exception:
                      decoded = None
              if not looks_like_pem(text):
                  print(
                      "ERROR: APP_STORE_CONNECT_PRIVATE_KEY is not a valid PEM private key "
                      "after normalizing quotes / literal \\\\n / base64.",
                      file=sys.stderr,
                  )
                  print(
                      "Paste the full AuthKey_*.p8 contents (including BEGIN/END lines) as Secure.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          else:
              # Still expand any remaining literal escapes inside an otherwise PEM-looking blob.
              if "\\n" in text:
                  text = text.replace("\\n", "\n").replace("\\r", "\r")

          # Ensure trailing newline for PEM parsers.
          if not text.endswith("\n"):
              text += "\n"

          out = "/tmp/AuthKey.p8"
          with open(out, "w", encoding="utf-8") as f:
              f.write(text)

          # Light validation without printing key material.
          with open(out, encoding="utf-8") as f:
              body = f.read()
          if "-----BEGIN" not in body or "PRIVATE KEY-----" not in body or "-----END" not in body:
              print("ERROR: Wrote key file but PEM markers are incomplete.", file=sys.stderr)
              sys.exit(1)
          print(f"Wrote normalized PEM to {out} ({len(body)} bytes, {body.count(chr(10))} lines).")
          PY

          # CLI は「PEM本文」か「@file:」「@env:」を取る。パス文字列そのものは不可。
          # 正規化済みファイルを env に載せ直し、Codemagic 標準の @env: 形式で渡す。
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$KEY_FILE")"

          # App Store 審査提出には default locale (ja) の What's New が必須
          WHATS_NEW_JA="${RELEASE_NOTES_JA:-メジャーアップデートです。バグ修正と改善を行いました。}"

          app-store-connect publish \
            --path "$IPA_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --app-store \
            --locale ja \
            --whats-new "$WHATS_NEW_JA" \
            --release-type AFTER_APPROVAL \
            --cancel-previous-submissions \
            --copyright "2026 Shunsuke Nakamura"
    artifacts:
      - build/ios/ipa/*.ipa
