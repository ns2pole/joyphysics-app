<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joy Physics — Store</title>
  <script>
    (function () {
      var ios = 'https://apps.apple.com/app/id6748957698';
      var play = 'https://play.google.com/store/apps/details?id=com.joyphysics';
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      if (isIOS) {
        location.replace(ios);
      } else if (isAndroid) {
        location.replace(play);
      }
      // Desktop / other: show both links below.
    })();
  </script>
</head>
<body>
  <p>Joy Physics</p>
  <p><a href="https://apps.apple.com/app/id6748957698">App Store (iOS)</a></p>
  <p><a href="https://play.google.com/store/apps/details?id=com.joyphysics">Google Play (Android)</a></p>
</body>
</html>
